<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Card Manager</title>
    <style>
        /* CSS Styling */
        :root {
            --table-green: #0b5e28;
            --table-border: #4a2c11;
            --card-white: #ffffff;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--table-green);
            background-image: radial-gradient(circle, #107c36 0%, #063817 100%);
            color: white;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        header {
            background-color: rgba(0, 0, 0, 0.4);
            padding: 15px;
            text-align: center;
            border-bottom: 4px solid var(--table-border);
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
            flex-wrap: wrap;
        }

        .header-setting {
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: bold;
            font-size: 16px;
            background: rgba(0,0,0,0.3);
            padding: 8px 12px;
            border-radius: 8px;
            border: 1px solid rgba(255,255,255,0.2);
        }

        .header-setting input {
            width: 50px;
            padding: 5px;
            border-radius: 4px;
            border: 1px solid #ccc;
            text-align: center;
            font-size: 16px;
            font-weight: bold;
        }

        button {
            padding: 8px 16px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            background-color: #d4af37;
            color: #000;
            border: 2px solid #fff;
            border-radius: 6px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            transition: transform 0.1s;
        }

        button:active {
            transform: scale(0.95);
        }

        /* Trash / Remove Zone */
        .trash-container {
            padding: 15px;
            display: flex;
            justify-content: center;
        }

        .trash-zone {
            width: 100%;
            max-width: 400px;
            min-height: 80px;
            border: 3px dashed #e74c3c;
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background-color: rgba(231, 76, 60, 0.15);
            transition: background-color 0.2s, border-style 0.2s;
        }

        .trash-title {
            font-weight: bold;
            font-size: 1.2rem;
            color: #ff7675;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .trash-sub {
            font-size: 0.8rem;
            color: #ccc;
            margin-top: 5px;
        }

        /* Players List Area */
        .players-area {
            display: flex;
            flex-direction: column;
            gap: 15px;
            padding: 10px 20px 20px 20px;
            overflow-y: auto;
            flex-grow: 1;
            max-width: 900px;
            margin: 0 auto;
            width: 100%;
            box-sizing: border-box;
        }

        .player-row {
            background-color: rgba(0, 0, 0, 0.3);
            border: 2px solid var(--table-border);
            border-radius: 10px;
            padding: 15px;
            display: flex;
            flex-direction: column;
            min-height: 140px;
        }

        .player-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.2);
            padding-bottom: 10px;
            margin-bottom: 5px;
        }

        .player-name {
            font-size: 1.4rem;
            font-weight: bold;
            color: #d4af37;
            border-bottom: 1px dashed rgba(212, 175, 55, 0.6);
            padding: 2px 5px;
            outline: none;
            cursor: text;
            transition: background 0.2s;
            max-width: 100%;
            word-wrap: break-word;
        }

        .player-name:focus {
            background-color: rgba(255, 255, 255, 0.1);
            border-bottom: 1px solid #d4af37;
            border-radius: 4px;
        }

        /* Add Card Controls */
        .player-controls {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
            background-color: rgba(0,0,0,0.2);
            padding: 8px;
            border-radius: 8px;
        }

        select {
            padding: 6px;
            border-radius: 4px;
            border: 1px solid #ccc;
            font-size: 14px;
            background-color: #fff;
            color: #000;
            cursor: pointer;
        }

        .remove-player {
            background-color: #c0392b;
            color: white;
            border-color: #8b0000;
            margin-left: auto;
        }

        .add-custom {
            background-color: #27ae60;
            color: white;
            border-color: #1e8449;
        }

        .cards-container {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            width: 100%;
            min-height: 110px;
            padding: 10px 0;
        }

        /* Card Styling */
        .card {
            width: 70px;
            height: 105px;
            background-color: var(--card-white);
            border: 1px solid #ccc;
            border-radius: 6px;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            font-size: 20px;
            font-weight: bold;
            cursor: grab;
            box-shadow: 2px 2px 5px rgba(0,0,0,0.4);
            user-select: none;
            color: #2d3436;
            padding: 5px;
            box-sizing: border-box;
            overflow: hidden;
            word-wrap: break-word;
            background-image: url('data:image/svg+xml;utf8,<svg width="10" height="10" viewBox="0 0 10 10" xmlns="http://www.w3.org/2000/svg"><circle cx="5" cy="5" r="1" fill="%23eee"/></svg>');
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .card:active {
            cursor: grabbing;
        }

        .card.red {
            color: #d63031;
        }

        /* Steal Animation Effect */
        .card.stolen {
            animation: pulse-gold 0.5s ease-out;
        }

        @keyframes pulse-gold {
            0% { transform: scale(1); box-shadow: 0 0 0 rgba(212, 175, 55, 0); }
            50% { transform: scale(1.15); box-shadow: 0 0 20px rgba(212, 175, 55, 1); border-color: #d4af37;}
            100% { transform: scale(1); box-shadow: 2px 2px 5px rgba(0,0,0,0.4); }
        }

        /* Drag over effects */
        .cards-container.drag-over {
            background-color: rgba(255, 255, 255, 0.1);
            border: 2px dashed #d4af37;
            border-radius: 8px;
        }

        .trash-zone.drag-over {
            background-color: rgba(231, 76, 60, 0.4);
            border-style: solid;
            border-color: #ff7675;
        }

        /* Mobile specific adjustments */
        @media (max-width: 600px) {
            .player-controls {
                width: 100%;
                justify-content: flex-start;
            }
            .remove-player {
                margin-left: 0;
                flex-grow: 1;
            }
        }
    </style>
</head>
<body>

    <header>
        <div class="header-setting">
            <label for="deckCount">Decks in Play:</label>
            <input type="number" id="deckCount" value="1" min="1" max="10">
        </div>
        <button onclick="addPlayer()">+ Add Player</button>
    </header>

    <div class="trash-container">
        <div class="trash-zone dropzone" id="trashZone">
            <div class="trash-title">🗑️ Remove Card</div>
            <div class="trash-sub">Drag and drop here to delete</div>
        </div>
    </div>

    <div class="players-area" id="playersContainer">
        </div>

    <script>
        let playerCounter = 1;

        // Constants for standard card dropdowns
        const valuesHtml = `
            <option value="A">A</option>
            <option value="2">2</option>
            <option value="3">3</option>
            <option value="4">4</option>
            <option value="5">5</option>
            <option value="6">6</option>
            <option value="7">7</option>
            <option value="8">8</option>
            <option value="9">9</option>
            <option value="10">10</option>
            <option value="J">J</option>
            <option value="Q">Q</option>
            <option value="K">K</option>
            <option value="Joker">Joker</option>
        `;

        const suitsHtml = `
            <option value="♠">♠ Spades</option>
            <option value="♥">♥ Hearts</option>
            <option value="♣">♣ Clubs</option>
            <option value="♦">♦ Diamonds</option>
            <option value="">None</option>
        `;

        // Initialize App
        document.addEventListener('DOMContentLoaded', () => {
            setupDropZones(); 
            addPlayer();
            addPlayer(); 
        });

        function createCardElement(value, suit) {
            const card = document.createElement('div');
            card.classList.add('card');
            
            // Check if suit requires red color
            if (suit === '♥' || suit === '♦') {
                card.classList.add('red');
            }
            
            // Store the signature to track duplicate limits across decks (e.g., "A-♠" or "Joker-")
            card.setAttribute('data-signature', `${value}-${suit}`);
            
            const uniqueId = `card-${Date.now()}-${Math.floor(Math.random() * 1000)}`;
            card.id = uniqueId;
            card.setAttribute('draggable', 'true');
            
            if (suit) {
                card.innerHTML = `${value}<br><span style="font-size:0.8em">${suit}</span>`;
            } else {
                card.innerHTML = `<span style="font-size:0.7em">${value}</span>`; 
            }

            // Standard HTML5 Drag Events
            card.addEventListener('dragstart', (e) => {
                e.dataTransfer.setData('text/plain', card.id);
                setTimeout(() => card.style.opacity = '0.5', 0);
            });

            card.addEventListener('dragend', (e) => {
                card.style.opacity = '1';
            });

            return card;
        }

        function addPlayer() {
            const container = document.getElementById('playersContainer');
            const playerId = `player-dropzone-${playerCounter}`;
            
            const playerRow = document.createElement('div');
            playerRow.classList.add('player-row');
            
            playerRow.innerHTML = `
                <div class="player-header">
                    <span class="player-name" contenteditable="true" spellcheck="false" title="Click to edit name">Player ${playerCounter}</span>
                    <div class="player-controls">
                        <select class="card-value-select">${valuesHtml}</select>
                        <select class="card-suit-select">${suitsHtml}</select>
                        <button class="add-custom" onclick="addCardFromSelects(this)">Add</button>
                        <button class="remove-player" onclick="this.closest('.player-row').remove()">Remove Player</button>
                    </div>
                </div>
                <div class="cards-container dropzone" id="${playerId}"></div>
            `;

            container.appendChild(playerRow);
            playerCounter++;
            setupDropZones(); 
        }

        function addCardFromSelects(buttonElement) {
            const controlsDiv = buttonElement.closest('.player-controls');
            const valueSelect = controlsDiv.querySelector('.card-value-select');
            const suitSelect = controlsDiv.querySelector('.card-suit-select');
            
            const value = valueSelect.value;
            const suit = suitSelect.value.charAt(0); 
            const signature = `${value}-${suit}`;
            
            // Core Logic for Deck Limits
            const decksCount = parseInt(document.getElementById('deckCount').value) || 1;
            
            // Standard cards have 1 per deck. Jokers usually have 2 per deck.
            const maxAllowed = (value === 'Joker') ? decksCount * 2 : decksCount;
            
            // Find all cards on the board that match this exact card signature
            const existingCards = document.querySelectorAll(`.card[data-signature="${signature}"]`);
            const playerDropzone = buttonElement.closest('.player-row').querySelector('.dropzone');
            
            if (existingCards.length >= maxAllowed) {
                // If limit reached, steal the oldest existing card instead of creating a new one
                const cardToSteal = existingCards[0];
                playerDropzone.appendChild(cardToSteal);
                
                // Play a brief visual animation so the user realizes the card was pulled from somewhere else
                cardToSteal.classList.remove('stolen');
                void cardToSteal.offsetWidth; // Trigger DOM reflow to restart animation
                cardToSteal.classList.add('stolen');
            } else {
                // Limit not reached, safe to generate a new card
                const newCard = createCardElement(value, suit);
                playerDropzone.appendChild(newCard);
            }
        }

        function setupDropZones() {
            // Find all dropzones that haven't been given event listeners yet
            document.querySelectorAll('.dropzone:not(.initialized)').forEach(zone => {
                
                // Mark this zone so we never add duplicate listeners to it again
                zone.classList.add('initialized');

                zone.addEventListener('dragover', (e) => {
                    e.preventDefault(); 
                    zone.classList.add('drag-over');
                });

                zone.addEventListener('dragleave', () => {
                    zone.classList.remove('drag-over');
                });

                zone.addEventListener('drop', (e) => {
                    e.preventDefault();
                    zone.classList.remove('drag-over');
                    
                    const cardId = e.dataTransfer.getData('text/plain');
                    const card = document.getElementById(cardId);
                    
                    if (card) {
                        if (zone.id === 'trashZone') {
                            card.remove(); 
                        } 
                        else if (zone !== card.parentElement) {
                            zone.appendChild(card);
                        }
                    }
                });
            });
        }
    </script>
</body>
</html>
